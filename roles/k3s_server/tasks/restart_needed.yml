---
# We restart K3s only if the files it reads at start changed since its last restart.
# Comparing with the last restart, not the start of this run, keeps a binary staged by
# the airgap play or a change left by a failed run. The record also holds the running
# service instance, so a restart outside site.yml, for example a rollback, makes the
# next run restart K3s once more.
- name: Fingerprint the k3s binary, service, environment, config and registries files
  ansible.builtin.stat:
    path: "{{ item }}"
    checksum_algorithm: sha256
    follow: true
  loop:
    - "{{ extra_install_envs.INSTALL_K3S_BIN_DIR | default('/usr/local/bin') }}/k3s"
    - "{{ (ansible_facts['service_mgr'] == 'systemd') | ternary(systemd_dir ~ '/k3s.service', '/etc/init.d/k3s') }}"
    - "{{ k3s_server_env_file }}"
    - /etc/rancher/k3s/config.yaml
    - /etc/rancher/k3s/registries.yaml
  register: k3s_server_restart_files

- name: Get the running K3s service instance
  ansible.builtin.command:
    cmd: >-
      {{ (ansible_facts['service_mgr'] == 'systemd')
      | ternary('systemctl show -p InvocationID --value k3s', 'cat /proc/sys/kernel/random/boot_id /run/openrc/options/k3s/child_pid') }}
  register: k3s_server_restart_instance
  changed_when: false
  failed_when: false
  check_mode: false

- name: Read the fingerprint recorded after the last restart
  ansible.builtin.slurp:
    src: /etc/rancher/k3s/k3s-ansible-restart.state
  register: k3s_server_restart_recorded
  failed_when: false

- name: Decide whether the K3s service needs a restart
  ansible.builtin.set_fact:
    k3s_server_restart_fingerprint: "{{ _fingerprint }}"
    k3s_server_restart_needed: "{{ (_fingerprint ~ ' ' ~ k3s_server_restart_instance.stdout) != (k3s_server_restart_recorded.content | default('') | b64decode | trim) }}"
  vars:
    _fingerprint: "{{ k3s_server_restart_files.results | map(attribute='stat.checksum', default='absent') | join(' ') }}"
