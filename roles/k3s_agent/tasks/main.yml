---
- name: Get k3s installed version
  ansible.builtin.command: k3s --version
  register: k3s_agent_version_output
  changed_when: false
  failed_when: false

- name: Set k3s installed version
  when: not ansible_check_mode and k3s_agent_version_output.rc == 0
  ansible.builtin.set_fact:
    k3s_agent_installed_version: "{{ k3s_agent_version_output.stdout_lines[0].split(' ')[2] }}"

# If airgapped, all K3s artifacts are already on the node.
# We should be downloading and installing the newer version only if we are in one of the following cases :
#   - we couldn't get k3s installed version in the first task of this role
#   - the installed version of K3s on the nodes is older than the requested version in ansible vars
- name: Download artifact only if needed
  when: not ansible_check_mode and airgap_dir is undefined and ( k3s_agent_version_output.rc != 0 or k3s_agent_installed_version is version(k3s_version, '<') )
  block:
    - name: Download K3s install script
      ansible.builtin.get_url:
        url: https://get.k3s.io/
        timeout: 120
        dest: /usr/local/bin/k3s-install.sh
        owner: root
        group: root
        mode: "0755"

    - name: Set skip_download var for install script
      # noqa var-naming[no-role-prefix]
      ansible.builtin.set_fact:
        skip_download: "false"

# We always run the install script, we just skip the download step as needed
- name: Run K3s install script
  # noqa var-naming[no-role-prefix]
  ansible.builtin.command:
    cmd: /usr/local/bin/k3s-install.sh
  environment: "{{ _install_envs }}"
  vars:
    _base_envs:
      INSTALL_K3S_SKIP_DOWNLOAD: "{{ skip_download | default('true') }}"
      INSTALL_K3S_SKIP_START: "true"
      INSTALL_K3S_SYSTEMD_DIR: "{{ systemd_dir }}"
      INSTALL_K3S_VERSION: "{{ k3s_version }}"
      INSTALL_K3S_EXEC: "agent --server https://{{ api_endpoint | ansible.utils.ipwrap }}:{{ api_port }} {{ extra_agent_args }}"
    # We overrides the extra_install_envs with required keys from _base_envs on purpose
    _install_envs: "{{ extra_install_envs | default({}) | combine(_base_envs) }}"
  changed_when: true

- name: Setup optional config file
  when: agent_config_yaml is defined
  block:
    - name: Make config directory
      ansible.builtin.file:
        path: "/etc/rancher/k3s"
        mode: "0755"
        state: directory
    - name: Copy config values
      # noqa var-naming[no-role-prefix]
      ansible.builtin.copy:
        content: "{{ agent_config_yaml }}"
        dest: "/etc/rancher/k3s/config.yaml"
        mode: "0644"
      register: _agent_config_result

- name: Get the token from the first server
  when: token is not defined and hostvars[groups[server_group][0]].random_token is defined
  # noqa var-naming[no-role-prefix]
  ansible.builtin.set_fact:
    token: "{{ hostvars[groups[server_group][0]].random_token }}"

- name: Set k3s agent environment file based on init system
  ansible.builtin.set_fact:
    k3s_agent_env_file: "{{ (ansible_facts['service_mgr'] == 'systemd') | ternary(systemd_dir ~ '/k3s-agent.service.env', '/etc/rancher/k3s/k3s-agent.env') }}"

- name: Add service environment variables
  when: extra_service_envs is defined
  ansible.builtin.lineinfile:
    path: "{{ k3s_agent_env_file }}"
    line: "{{ item }}"
  loop: "{{ extra_service_envs }}"

- name: Delete any existing token from the environment if different from the new one
  ansible.builtin.lineinfile:
    state: absent
    path: "{{ k3s_agent_env_file }}"
    regexp: "^K3S_TOKEN=\\s*(?!{{ token | regex_escape }}\\s*$)"

- name: Add the token for joining the cluster to the environment
  no_log: true # avoid logging the server token
  ansible.builtin.lineinfile:
    path: "{{ k3s_agent_env_file }}"
    line: "{{ item }}"
  loop:
    - "K3S_TOKEN={{ token }}"

# With k3s_restart_on_change, we restart the agent only if the files it reads at start
# changed since its last restart, or it was restarted outside site.yml (same check as
# roles/k3s_server/tasks/restart_needed.yml).
- name: Check whether the K3s agent needs a restart
  when: k3s_restart_on_change | bool
  block:
    - name: Fingerprint the k3s binary, service, environment, config and registries files
      ansible.builtin.stat:
        path: "{{ item }}"
        checksum_algorithm: sha256
        follow: true
      loop:
        - "{{ extra_install_envs.INSTALL_K3S_BIN_DIR | default('/usr/local/bin') }}/k3s"
        - "{{ (ansible_facts['service_mgr'] == 'systemd') | ternary(systemd_dir ~ '/k3s-agent.service', '/etc/init.d/k3s-agent') }}"
        - "{{ k3s_agent_env_file }}"
        - /etc/rancher/k3s/config.yaml
        - /etc/rancher/k3s/registries.yaml
      register: k3s_agent_restart_files

    - name: Get the running K3s agent instance
      ansible.builtin.command:
        cmd: >-
          {{ (ansible_facts['service_mgr'] == 'systemd')
          | ternary('systemctl show -p InvocationID --value k3s-agent', 'cat /proc/sys/kernel/random/boot_id /run/openrc/options/k3s-agent/child_pid') }}
      register: k3s_agent_restart_instance
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Read the fingerprint recorded after the last restart
      ansible.builtin.slurp:
        src: /etc/rancher/k3s/k3s-ansible-restart.state
      register: k3s_agent_restart_recorded
      failed_when: false

    - name: Decide whether the K3s agent needs a restart
      ansible.builtin.set_fact:
        k3s_agent_restart_fingerprint: "{{ _fingerprint }}"
        k3s_agent_restart_needed: "{{ (_fingerprint ~ ' ' ~ k3s_agent_restart_instance.stdout) != (k3s_agent_restart_recorded.content | default('') | b64decode | trim) }}"
      vars:
        _fingerprint: "{{ k3s_agent_restart_files.results | map(attribute='stat.checksum', default='absent') | join(' ') }}"

# Always restart so a re-run of site.yml — whether it changed the agent config
# or bumped k3s_version — reliably brings the agent onto the new state. The
# install script leaves the service stopped (INSTALL_K3S_SKIP_START), so a plain
# restart also covers the first install.
# With k3s_restart_on_change, only when its files changed.
- name: Enable and start K3s agent
  when: not ansible_check_mode
  ansible.builtin.service:
    name: k3s-agent
    state: "{{ 'restarted' if (not (k3s_restart_on_change | bool) or k3s_agent_restart_needed) else 'started' }}"
    enabled: true

- name: Record the fingerprint the K3s agent now runs with
  when:
    - not ansible_check_mode
    - k3s_restart_on_change | bool
  block:
    - name: Make config directory for the fingerprint
      ansible.builtin.file:
        path: /etc/rancher/k3s
        mode: "0755"
        state: directory

    - name: Get the K3s agent instance now running
      ansible.builtin.command:
        cmd: >-
          {{ (ansible_facts['service_mgr'] == 'systemd')
          | ternary('systemctl show -p InvocationID --value k3s-agent', 'cat /proc/sys/kernel/random/boot_id /run/openrc/options/k3s-agent/child_pid') }}
      register: k3s_agent_restart_instance
      changed_when: false

    - name: Write the fingerprint
      ansible.builtin.copy:
        content: "{{ k3s_agent_restart_fingerprint }} {{ k3s_agent_restart_instance.stdout }}\n"
        dest: /etc/rancher/k3s/k3s-ansible-restart.state
        mode: "0600"
