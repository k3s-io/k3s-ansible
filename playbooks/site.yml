---
- name: Cluster prep
  hosts: k3s_cluster
  gather_facts: true
  become: true
  roles:
    - role: prereq
    - role: airgap
    - role: raspberrypi

- name: Setup K3S server
  hosts: server
  gather_facts: false
  become: true
  # A multi-server cluster sets k3s_server_serial to 1 so the servers restart
  # one at a time, and k3s_server_wait_etcd_voters so a member is a voter again
  # before the next one restarts. serial is templated before any host is bound,
  # so the value has to come from --extra-vars or from the vars of an
  # import_playbook; an inventory variable does not reach it and is ignored.
  serial: "{{ k3s_server_serial | default('100%') }}"
  roles:
    - role: k3s_server

- name: Setup K3S agent
  hosts: agent
  gather_facts: false
  become: true
  serial: "{{ k3s_agent_serial | default('100%') }}"
  roles:
    - role: k3s_agent
