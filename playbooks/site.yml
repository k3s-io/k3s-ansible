---
- name: Cluster prep
  hosts: "{{  k3s_ansible_cluster_group | default('k3s_cluster') }}"
  vars:
  - server_group: "{{  k3s_ansible_server_group | default('server') }}"
  - agent_group: "{{  k3s_ansible_agent_group | default('agent') }}"
  gather_facts: true
  become: true
  roles:
    - role: prereq
    - role: airgap
    - role: raspberrypi

- name: Setup K3S server
  hosts: "{{  k3s_ansible_server_group | default('server') }}"
  vars:
  - server_group: "{{  k3s_ansible_server_group | default('server') }}"
  - agent_group: "{{  k3s_ansible_agent_group | default('agent') }}"
  gather_facts: false
  become: true
  serial: "{{ k3s_server_serial | default('100%') }}"
  roles:
    - role: k3s_server

- name: Setup K3S agent
  hosts: "{{  k3s_ansible_agent_group | default('agent') }}"
  vars:
  - server_group: "{{  k3s_ansible_server_group | default('server') }}"
  - agent_group: "{{  k3s_ansible_agent_group | default('agent') }}"
  gather_facts: false
  become: true
  roles:
    - role: k3s_agent
