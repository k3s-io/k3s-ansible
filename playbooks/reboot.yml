---
- name: Reboot cluster servers staggered
  hosts: "{{  k3s_ansible_server_group | default('server) }}"
  become: true
  gather_facts: true
  serial: 1
  tasks:
    - name: Reboot
      ansible.builtin.reboot:
        test_command: kubectl get nodes

- name: Reboot cluster agents staggered
  hosts: "{{  k3s_ansible_agent_group | default('agent) }}"
  become: true
  gather_facts: true
  serial: 1
  tasks:
    - name: Reboot
      ansible.builtin.reboot:
