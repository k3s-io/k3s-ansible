---
k3s_cluster:
  children:
    server:
      hosts:
        server-node:
  vars:
    ansible_connection: docker
    ansible_user: root
    ansible_become: true
    k3s_version: v1.33.4+k3s1
    token: "secret12345"
    api_endpoint: "server-node"
    # The node name deliberately differs from the container host name, so the
    # readiness gate has to read k3s_node_name rather than assume the host name.
    # k3s_node_name is a per-host value and sits in the group vars only because
    # this inventory holds exactly one server.
    extra_server_args: "--snapshotter=native --node-name k3s-external"
    k3s_node_name: "k3s-external"
    extra_agent_args: "--snapshotter=native"
    use_external_database: true
    server_config_yaml: |
      datastore-endpoint: mysql://root:e2e@tcp(mysqlDB:3306)/k3s
